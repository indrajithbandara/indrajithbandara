<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160"><title>Terminal boot sequence</title><style>.line{animation:reveal .4s both}@keyframes reveal{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><rect x="1" y="1" width="358" height="158" rx="12" fill="#0d1117" stroke="#484f58"/><g font-family="monospace" font-size="17"><text x="20" y="30" fill="#56d364">$ boot profile</text><text class="line" style="animation-delay:.3s" x="20" y="60" fill="#e6edf3">[ OK ] Identity loaded</text><text class="line" style="animation-delay:.8s" x="20" y="87" fill="#e6edf3">[ OK ] Project directory</text><text class="line" style="animation-delay:1.3s" x="20" y="114" fill="#e6edf3">[ OK ] Command index</text><text class="line" style="animation-delay:1.8s" x="20" y="141" fill="#56d364">Ready. Select a command.</text></g></svg>