name: Refresh profile metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/refresh_profile.py
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          ref: main
      - name: Refresh metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_profile.py
      - name: Commit changed metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile metrics"
          git push origin HEAD:main
